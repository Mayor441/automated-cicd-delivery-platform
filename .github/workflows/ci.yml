
name: Employee Management CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employee_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build and test with Maven
        working-directory: springboot-app
        env:
          DB_PASSWORD: root
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-jar
          path: springboot-app/target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: build

    # Publish only after a successful push to main.
    # Pull requests will run CI but will not publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: employee-management-jar
          path: springboot-app/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./springboot-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  

  deploy:
    name: Deploy to Windows Self-Hosted Runner
    runs-on: [self-hosted, Windows, X64]
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest repository changes
        shell: powershell
        run: |
          git -C E:\CI-CD-Delivery-Platform pull --ff-only origin main

      - name: Pull latest Docker image
        shell: powershell
        working-directory: E:\CI-CD-Delivery-Platform
        run: |
          docker compose pull app

      - name: Deploy application
        shell: powershell
        working-directory: E:\CI-CD-Delivery-Platform
        run: |
          docker compose up -d --no-build app

      - name: Verify application health
        shell: powershell
        run: |
          $url = "http://localhost:8080/api/employees"
          $healthy = $false

          for ($i = 1; $i -le 12; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $healthy) {
            docker logs employee-app --tail 100
            throw "Application health check failed"
          }

          Write-Host "Deployment successful. Application is responding."

